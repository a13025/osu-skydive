<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

/* =====================================================================
   工具
   ===================================================================== */
function mulberry32(a) {
  return function () {
    a |= 0; a = a + 0x6D2B79F5 | 0;
    let t = Math.imul(a ^ a >>> 15, 1 | a);
    t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t;
    return ((t ^ t >>> 14) >>> 0) / 4294967296;
  };
}

function makeNoise2D(seed) {
  const rand = mulberry32(seed);
  const p = new Uint8Array(256);
  for (let i = 0; i < 256; i++) p[i] = i;
  for (let i = 255; i > 0; i--) { const j = Math.floor(rand() * (i + 1)); const t = p[i]; p[i] = p[j]; p[j] = t; }
  const perm = new Uint8Array(512);
  for (let i = 0; i < 512; i++) perm[i] = p[i & 255];
  const fade = t => t * t * t * (t * (t * 6 - 15) + 10);
  const lerp = (a, b, t) => a + (b - a) * t;
  const grad = (h, x, y) => {
    const hh = h & 3;
    const u = hh < 2 ? x : y;
    const v = hh < 2 ? y : x;
    return ((hh & 1) ? -u : u) + ((hh & 2) ? -v : v);
  };
  return function (x, y) {
    const X = Math.floor(x) & 255, Y = Math.floor(y) & 255;
    const xf = x - Math.floor(x), yf = y - Math.floor(y);
    const u = fade(xf), v = fade(yf);
    const aa = perm[perm[X] + Y], ab = perm[perm[X] + Y + 1];
    const ba = perm[perm[X + 1] + Y], bb = perm[perm[X + 1] + Y + 1];
    return lerp(
      lerp(grad(aa, xf, yf), grad(ba, xf - 1, yf), u),
      lerp(grad(ab, xf, yf - 1), grad(bb, xf - 1, yf - 1), u),
      v
    );
  };
}

function fbm(noise, x, y, oct = 4, lac = 2.0, gain = 0.5) {
  let a = 1, f = 1, s = 0, n = 0;
  for (let i = 0; i < oct; i++) { s += a * noise(x * f, y * f); n += a; a *= gain; f *= lac; }
  return s / n;
}

const smoothstep = (e0, e1, x) => {
  const t = Math.max(0, Math.min(1, (x - e0) / (e1 - e0)));
  return t * t * (3 - 2 * t);
};

/* =====================================================================
   方向
   ===================================================================== */
const SUN_DIR = new THREE.Vector3(-0.48, 0.62, 0.62).normalize();
const VISUAL_SUN_DIR = new THREE.Vector3(-0.50, 0.14, -0.85).normalize();

/* =====================================================================
   天空纹理（深蓝清透 + 高亮太阳 + 少量薄云）
   ===================================================================== */
function createSkyTexture(sunDirVisual) {
  const W = 4096, H = 2048;
  const cv = document.createElement('canvas');
  cv.width = W; cv.height = H;
  const ctx = cv.getContext('2d');

  // 更饱和的蓝天渐变
  const g = ctx.createLinearGradient(0, 0, 0, H);
  g.addColorStop(0.00, '#0b4fb2');
  g.addColorStop(0.12, '#1d6fd0');
  g.addColorStop(0.26, '#4a9de8');
  g.addColorStop(0.38, '#8dc8f4');
  g.addColorStop(0.46, '#c6e8fb');
  g.addColorStop(0.50, '#e2f4fe');
  g.addColorStop(0.54, '#c4e5f8');
  g.addColorStop(0.64, '#9ecff0');
  g.addColorStop(1.00, '#83b3d4');
  ctx.fillStyle = g;
  ctx.fillRect(0, 0, W, H);

  const lat = Math.asin(sunDirVisual.y);
  let phi = Math.atan2(sunDirVisual.z, -sunDirVisual.x);
  if (phi < 0) phi += Math.PI * 2;
  const sunX = (phi / (Math.PI * 2)) * W;
  const sunY = (1 - (0.5 + lat / Math.PI)) * H;

  // 大范围暖光晕
  const halo = ctx.createRadialGradient(sunX, sunY, 0, sunX, sunY, 1500);
  halo.addColorStop(0.00, 'rgba(255,252,232,0.92)');
  halo.addColorStop(0.07, 'rgba(255,247,205,0.52)');
  halo.addColorStop(0.20, 'rgba(255,240,180,0.22)');
  halo.addColorStop(0.52, 'rgba(255,235,170,0.06)');
  halo.addColorStop(1.00, 'rgba(255,230,160,0)');
  ctx.fillStyle = halo;
  ctx.beginPath(); ctx.arc(sunX, sunY, 1500, 0, Math.PI * 2); ctx.fill();

  // 太阳核心
  const core = ctx.createRadialGradient(sunX, sunY, 0, sunX, sunY, 140);
  core.addColorStop(0.00, 'rgba(255,255,255,1)');
  core.addColorStop(0.35, 'rgba(255,255,250,0.98)');
  core.addColorStop(0.70, 'rgba(255,253,228,0.70)');
  core.addColorStop(1.00, 'rgba(255,246,192,0)');
  ctx.fillStyle = core;
  ctx.beginPath(); ctx.arc(sunX, sunY, 140, 0, Math.PI * 2); ctx.fill();

  // 薄云（数量更少、alpha 更低）
  let seed = 81123;
  const rnd = () => { seed = (seed * 1664525 + 1013904223) % 4294967296; return seed / 4294967296; };

  const puff = (cx, cy, sc, a) => {
    const parts = [
      [-1.00, 0.15, 0.95], [-0.55, -0.14, 1.12], [0.02, -0.30, 1.24],
      [0.60, -0.10, 1.00], [1.15, 0.20, 0.78], [0.28, 0.38, 1.02], [-0.60, 0.40, 0.82]
    ];
    for (const [dx, dy, r] of parts) {
      const rad = r * sc;
      const x = cx + dx * sc, y = cy + dy * sc;
      const rg = ctx.createRadialGradient(x, y, rad * 0.12, x, y, rad);
      rg.addColorStop(0.00, `rgba(255,255,252,${a})`);
      rg.addColorStop(0.50, `rgba(255,255,250,${a * 0.45})`);
      rg.addColorStop(1.00, 'rgba(255,255,248,0)');
      ctx.fillStyle = rg;
      ctx.beginPath(); ctx.arc(x, y, rad, 0, Math.PI * 2); ctx.fill();
    }
  };

  const bands = [
    { y: 330, n: 5, s: [80, 150], a: 0.24 },
    { y: 430, n: 4, s: [110, 200], a: 0.32 },
    { y: 510, n: 3, s: [90, 160], a: 0.20 }
  ];
  for (const b of bands) {
    for (let i = 0; i < b.n; i++) {
      const bx = rnd() * W;
      const by = b.y + (rnd() - 0.5) * 100;
      const sc = b.s[0] + rnd() * (b.s[1] - b.s[0]);
      const a = b.a * (0.7 + rnd() * 0.4);
      for (const off of [-W, 0, W]) puff(bx + off, by, sc, a);
    }
  }

  const tex = new THREE.CanvasTexture(cv);
  tex.colorSpace = THREE.SRGBColorSpace;
  tex.wrapS = THREE.RepeatWrapping;
  tex.anisotropy = 8;
  return tex;
}

/* =====================================================================
   地形 + 河流（更饱和的绿色分层）
   ===================================================================== */
function buildTerrainAndRiver() {
  const SIZE = 6000, SEG = 300;
  const STEP = SIZE / SEG;
  const noise = makeNoise2D(42317);

  const riverCtrl = [
    new THREE.Vector3(-2200, 0, 900),
    new THREE.Vector3(-1300, 0, 300),
    new THREE.Vector3(-520, 0, -420),
    new THREE.Vector3(280, 0, 220),
    new THREE.Vector3(1100, 0, -380),
    new THREE.Vector3(2100, 0, 780)
  ];
  const riverCurve = new THREE.CatmullRomCurve3(riverCtrl);
  const RS = 400;
  const riverSamples = riverCurve.getPoints(RS);

  const geo = new THREE.PlaneGeometry(SIZE, SIZE, SEG, SEG);
  geo.rotateX(-Math.PI / 2);
  const posAttr = geo.attributes.position;
  const N = posAttr.count;
  const heights = new Float32Array(N);

  for (let i = 0; i < N; i++) {
    const x = posAttr.getX(i), z = posAttr.getZ(i);
    const dist = Math.sqrt(x * x + z * z);

    const hill = (fbm(noise, x * 0.0010, z * 0.0010, 3) * 0.5 + 0.5) * 72;
    const mid = (fbm(noise, x * 0.0028, z * 0.0028, 2) * 0.5 + 0.5) * 10;

    const mMask = smoothstep(900, 2500, dist);
    const mBase = (fbm(noise, x * 0.00040, z * 0.00040, 3) * 0.5 + 0.5) * 520;
    const ridge = Math.pow(1 - Math.abs(fbm(noise, x * 0.00070, z * 0.00070, 2)), 2.2) * 300;
    const mountain = (mBase + ridge) * mMask;

    heights[i] = -230 + hill + mid + mountain;
  }

  const sampleH = (x, z) => {
    const ix = Math.max(0, Math.min(SEG, Math.round((x + SIZE / 2) / STEP)));
    const iz = Math.max(0, Math.min(SEG, Math.round((z + SIZE / 2) / STEP)));
    return heights[iz * (SEG + 1) + ix];
  };

  const riverY = new Float32Array(riverSamples.length);
  for (let i = 0; i < riverSamples.length; i++) {
    riverY[i] = sampleH(riverSamples[i].x, riverSamples[i].z) - 1.0;
  }
  for (let pass = 0; pass < 16; pass++) {
    for (let i = 1; i < riverY.length - 1; i++) {
      riverY[i] = (riverY[i - 1] + riverY[i] * 2 + riverY[i + 1]) / 4;
    }
  }

  const RIVER_INFLUENCE = 80, RIVER_DEPTH = 4.0;
  const riverMask = new Float32Array(N);

  for (let i = 0; i < N; i++) {
    const x = posAttr.getX(i), z = posAttr.getZ(i);
    let bestD2 = Infinity, bestIdx = 0;
    for (let k = 0; k < riverSamples.length; k++) {
      const dx = x - riverSamples[k].x, dz = z - riverSamples[k].z;
      const d2 = dx * dx + dz * dz;
      if (d2 < bestD2) { bestD2 = d2; bestIdx = k; }
    }
    const d = Math.sqrt(bestD2);
    if (d < RIVER_INFLUENCE) {
      const t = d / RIVER_INFLUENCE;
      const blend = 1 - smoothstep(0, 1, Math.pow(t, 0.7));
      const bedY = riverY[bestIdx] - RIVER_DEPTH;
      if (heights[i] > bedY) heights[i] = heights[i] * (1 - blend) + bedY * blend;
      riverMask[i] = blend;
    }
  }

  for (let i = 0; i < N; i++) posAttr.setY(i, heights[i]);
  geo.computeVertexNormals();

  const colors = new Float32Array(N * 3);
  const normals = geo.attributes.normal;

  for (let i = 0; i < N; i++) {
    const x = posAttr.getX(i), h = posAttr.getY(i), z = posAttr.getZ(i);
    const ny = normals.getY(i);
    const slope = Math.max(0, 1 - ny);
    const c = terrainColor(h, slope, x, z, noise);
    if (riverMask[i] > 0.3) {
      const sand = new THREE.Color(0.62, 0.56, 0.40);
      c.lerp(sand, Math.min(1, (riverMask[i] - 0.3) * 1.2));
    }
    colors[i * 3] = c.r; colors[i * 3 + 1] = c.g; colors[i * 3 + 2] = c.b;
  }
  geo.setAttribute('color', new THREE.BufferAttribute(colors, 3));

  const terrain = new THREE.Mesh(geo, new THREE.MeshStandardMaterial({
    vertexColors: true,
    roughness: 0.86,
    metalness: 0.0,
    envMapIntensity: 0.55,
  }));
  terrain.receiveShadow = true;

  const wPositions = [], wUvs = [], wIndices = [];
  for (let i = 0; i < riverSamples.length; i++) {
    const t = i / (riverSamples.length - 1);
    const p = riverSamples[i];
    const pNext = riverSamples[Math.min(i + 1, riverSamples.length - 1)];
    const pPrev = riverSamples[Math.max(i - 1, 0)];
    const tx = pNext.x - pPrev.x, tz = pNext.z - pPrev.z;
    const len = Math.hypot(tx, tz) || 1;
    const nx = -tz / len, nz = tx / len;
    const w = 30 * (0.55 + 0.45 * Math.sin(t * Math.PI + 0.3));
    wPositions.push(p.x + nx * w, riverY[i] + 0.12, p.z + nz * w);
    wPositions.push(p.x - nx * w, riverY[i] + 0.12, p.z - nz * w);
    wUvs.push(0, t * 50); wUvs.push(1, t * 50);
  }
  for (let i = 0; i < riverSamples.length - 1; i++) {
    const a = i * 2, b = a + 1, c = a + 2, d = a + 3;
    wIndices.push(a, c, b, b, c, d);
  }
  const wGeo = new THREE.BufferGeometry();
  wGeo.setAttribute('position', new THREE.Float32BufferAttribute(wPositions, 3));
  wGeo.setAttribute('uv', new THREE.Float32BufferAttribute(wUvs, 2));
  wGeo.setIndex(wIndices);
  wGeo.computeVertexNormals();

  const water = new THREE.Mesh(wGeo, new THREE.MeshStandardMaterial({
    color: 0x1f5fa0, metalness: 0.30, roughness: 0.12,
    envMapIntensity: 1.1, transparent: true, opacity: 0.95,
  }));

  return { terrain, water };
}

function terrainColor(h, slope, x, z, noise) {
  const c = new THREE.Color();
  const hRel = h + 230;

  // 更饱和、更翠绿的分层
  if (hRel < 10) {
    c.setRGB(0.14, 0.34, 0.09);
  } else if (hRel < 55) {
    const t = (hRel - 10) / 45;
    c.setRGB(0.14 + t * 0.14, 0.34 + t * 0.16, 0.09 + t * 0.08);
  } else if (hRel < 130) {
    const t = (hRel - 55) / 75;
    c.setRGB(0.28 + t * 0.12, 0.50 + t * 0.08, 0.17 + t * 0.06);
  } else if (hRel < 260) {
    const t = (hRel - 130) / 130;
    c.setRGB(0.40 - t * 0.04, 0.58 - t * 0.08, 0.23 + t * 0.10);
  } else if (hRel < 480) {
    const t = (hRel - 260) / 220;
    c.setRGB(0.36 + t * 0.16, 0.50 + t * 0.14, 0.33 + t * 0.10);
  } else {
    const t = Math.min(1, (hRel - 480) / 240);
    c.setRGB(0.52 + t * 0.42, 0.64 + t * 0.32, 0.43 + t * 0.50);
  }

  const rockAmt = smoothstep(0.38, 0.72, slope);
  if (rockAmt > 0) {
    c.lerp(new THREE.Color(0.42, 0.36, 0.30), rockAmt * 0.9);
  }

  const shade = fbm(noise, x * 0.00035 + 1000, z * 0.00035 + 1000, 2) * 0.5 + 0.5;
  c.multiplyScalar(0.92 + shade * 0.10);

  return c;
}

/* =====================================================================
   蓝色 V 型领带（更饱和的蓝）
   ===================================================================== */
function createBlueRibbon() {
  const body = new THREE.Group();
  const S = 1.5 / 23.05, CX = 55.70, CY = 98.55;
  const sx = (x) => (x - CX) * S, sy = (y) => (CY - y) * S;

  const svgToShape = (d) => {
    const shape = new THREE.Shape(), t = d.match(/[MLCZ]|-?\d+(?:\.\d+)?/gi) || [];
    let i = 0, cmd = '';
    while (i < t.length) {
      if (/^[MLCZ]$/i.test(t[i])) { if ((cmd = t[i++].toUpperCase()) === 'Z') shape.closePath(); continue; }
      if (cmd === 'M') { shape.moveTo(sx(+t[i++]), sy(+t[i++])); cmd = 'L'; }
      else if (cmd === 'L') shape.lineTo(sx(+t[i++]), sy(+t[i++]));
      else if (cmd === 'C') shape.bezierCurveTo(sx(+t[i++]), sy(+t[i++]), sx(+t[i++]), sy(+t[i++]), sx(+t[i++]), sy(+t[i++]));
    }
    return shape;
  };

  const opt = { depth: 0.06, bevelEnabled: true, bevelThickness: 0.008, bevelSize: 0.008, bevelSegments: 2 };

  const back = new THREE.Mesh(
    new THREE.ExtrudeGeometry(svgToShape("M60.85 39.45 L79.75 39.45 L64.05 68.05 L48.05 68.05 Z"), opt),
    new THREE.MeshPhysicalMaterial({
      color: 0x0f56a8, roughness: 0.46, clearcoat: 0.20, clearcoatRoughness: 0.45,
    })
  );
  back.position.z = -0.03;
  back.castShadow = true; back.receiveShadow = true;

  const front = new THREE.Mesh(
    new THREE.ExtrudeGeometry(svgToShape("M30.45 39.45 L50.15 39.45 L63.05 68.05 L48.05 68.05 Z"), opt),
    new THREE.MeshPhysicalMaterial({
      color: 0x1288ff, roughness: 0.38, clearcoat: 0.32, clearcoatRoughness: 0.28,
    })
  );
  front.position.z = 0.06;
  front.castShadow = true; front.receiveShadow = true;

  body.add(back, front);

  const riserL = new THREE.Object3D(); riserL.position.set(sx(40.30), sy(39.45), 0.08);
  const riserR = new THREE.Object3D(); riserR.position.set(sx(70.30), sy(39.45), -0.02);
  body.add(riserL, riserR);

  return { group: body, riserL, riserR, bottomY: sy(68.05) };
}

function loadSvgTexture(svgString, size = 1024) {
  return new Promise((resolve) => {
    const s = svgString.replace(/<svg\s/, `<svg width="${size}" height="${size}" `);
    const blob = new Blob([s], { type: 'image/svg+xml;charset=utf-8' });
    const url = URL.createObjectURL(blob);
    const img = new Image();
    img.onload = () => {
      const cv = document.createElement('canvas');
      cv.width = cv.height = size;
      const ctx = cv.getContext('2d');
      ctx.clearRect(0, 0, size, size);
      ctx.drawImage(img, 0, 0, size, size);
      URL.revokeObjectURL(url);
      const tex = new THREE.CanvasTexture(cv);
      tex.colorSpace = THREE.SRGBColorSpace;
      tex.anisotropy = 8;
      resolve(tex);
    };
    img.onerror = () => { URL.revokeObjectURL(url); resolve(null); };
    img.src = url;
  });
}

function createOsuLogo() {
  const group = new THREE.Group();
  const R = 2.6;
  const S = R / 150;

  const base = new THREE.Mesh(
    new THREE.CylinderGeometry(150 * S, 150 * S, 0.16, 96),
    new THREE.MeshPhysicalMaterial({
      color: 0xffffff, roughness: 0.20, metalness: 0.04,
      clearcoat: 0.75, clearcoatRoughness: 0.14, envMapIntensity: 0.95,
    })
  );
  base.rotation.x = Math.PI / 2;
  base.castShadow = true; base.receiveShadow = true;
  group.add(base);

  const faceMat = new THREE.MeshPhysicalMaterial({
    color: 0xff44a0, roughness: 0.30, metalness: 0.03,
    clearcoat: 0.25, clearcoatRoughness: 0.35, envMapIntensity: 0.95,
  });

  const faceGeo = new THREE.CircleGeometry(150 * S * 0.995, 96);
  const face = new THREE.Mesh(faceGeo, faceMat);
  face.position.z = 0.085;
  face.castShadow = true; face.receiveShadow = true;
  group.add(face);

  const faceB = new THREE.Mesh(faceGeo, faceMat);
  faceB.position.z = -0.085;
  faceB.rotation.y = Math.PI;
  group.add(faceB);

  loadSvgTexture(OSU_SVG, 1024).then((tex) => {
    if (!tex) return;
    faceMat.map = tex;
    faceMat.bumpMap = tex;
    faceMat.bumpScale = 0.008;
    faceMat.color.set(0xffffff);
    faceMat.needsUpdate = true;
  });

  return { group, radius: R };
}

/* =====================================================================
   7 气室冲压翼伞（顶点色更饱和，弱化 sheen 白感）
   ===================================================================== */
function createRamAirParachute() {
  const group = new THREE.Group();
  const COLORS = ['#FFC700', '#FF352B', '#34C759', '#0A84FF', '#34C759', '#FF352B', '#FFC700'].map(c => new THREE.Color(c));
  const CELLS = 7, NU = 12, NV = 18, INSET = 0.225;
  const verts = [], cols = [], idx = [];

  const addV = (u, v, w, inset, c, m = 1) => {
    verts.push({ u, v, w, inset });
    cols.push(c.r * m, c.g * m, c.b * m);
    return verts.length - 1;
  };
  const addQ = (a, b, c, d) => idx.push(a, b, d, b, c, d);
  const lerp = (a, b, t) => a + (b - a) * t;
  const sm = (e0, e1, x) => { const t = Math.max(0, Math.min(1, (x - e0) / (e1 - e0))); return t * t * (3 - 2 * t); };

  for (let c = 0; c < CELLS; c++) {
    const col = COLORS[c], u0 = c / CELLS, u1 = (c + 1) / CELLS, top = [], bot = [];
    for (let iu = 0; iu <= NU; iu++) {
      const u = lerp(u0, u1, iu / NU), tR = [], bR = [];
      for (let iv = 0; iv <= NV; iv++) {
        tR.push(addV(u, iv / NV, 1, 0, col, 0.98 + 0.02 * sm(0, 0.15, Math.min(iu, NU - iu) / NU)));
        bR.push(addV(u, iv / NV, 0, 0, col, 0.86));
      }
      top.push(tR); bot.push(bR);
    }
    for (let iu = 0; iu < NU; iu++) {
      for (let iv = 0; iv < NV; iv++) {
        addQ(top[iu][iv], top[iu + 1][iv], top[iu + 1][iv + 1], top[iu][iv + 1]);
        addQ(bot[iu + 1][iv], bot[iu][iv], bot[iu][iv + 1], bot[iu + 1][iv + 1]);
      }
      const uA = lerp(u0, u1, iu / NU), uB = lerp(u0, u1, (iu + 1) / NU);
      addQ(addV(uA, 0, 1, 0, col, 0.90), addV(uA, 0, 0, 0, col, 0.82), addV(uB, 0, 0, 0, col, 0.82), addV(uB, 0, 1, 0, col, 0.90));
      addQ(addV(uA, 1, 1, 0, col, 0.82), addV(uB, 1, 1, 0, col, 0.82), addV(uB, 1, 1, INSET, col, 0.55), addV(uA, 1, 1, INSET, col, 0.55));
      addQ(addV(uB, 1, 0, 0, col, 0.78), addV(uA, 1, 0, 0, col, 0.78), addV(uA, 1, 0, INSET, col, 0.50), addV(uB, 1, 0, INSET, col, 0.50));
      addQ(addV(uA, 1, 1, INSET, col, 0.48), addV(uB, 1, 1, INSET, col, 0.48), addV(uB, 1, 0, INSET, col, 0.44), addV(uA, 1, 0, INSET, col, 0.44));
    }
  }

  const wingGeo = new THREE.BufferGeometry();
  const posArr = new Float32Array(verts.length * 3);
  const posAttr = new THREE.BufferAttribute(posArr, 3).setUsage(THREE.DynamicDrawUsage);
  wingGeo.setAttribute('position', posAttr);
  wingGeo.setAttribute('color', new THREE.Float32BufferAttribute(cols, 3));
  wingGeo.setIndex(idx);

  // 织物材质：低 sheen 避免泛白，低 envMapIntensity 避免环境反射冲淡颜色
  const wingMesh = new THREE.Mesh(wingGeo, new THREE.MeshPhysicalMaterial({
    vertexColors: true,
    roughness: 0.62,
    metalness: 0.0,
    clearcoat: 0.02,
    clearcoatRoughness: 0.7,
    sheen: 0.22,
    sheenRoughness: 0.7,
    sheenColor: new THREE.Color(0xffd89a),
    side: THREE.DoubleSide,
    envMapIntensity: 0.65,
  }));
  wingMesh.castShadow = true;
  wingMesh.receiveShadow = true;
  group.add(wingMesh);

  const CHORDS = [0.10, 0.50, 0.92], SEGS = 10, COSH = Math.cosh(1.7);
  const lineArr = new Float32Array(24 * SEGS * 2 * 3);
  const lineAttr = new THREE.BufferAttribute(lineArr, 3).setUsage(THREE.DynamicDrawUsage);
  const lineGeo = new THREE.BufferGeometry().setAttribute('position', lineAttr);
  group.add(new THREE.LineSegments(lineGeo, new THREE.LineBasicMaterial({
    color: 0xf4f7fb, transparent: true, opacity: 0.9,
  })));

  const evalPt = (u, v, w, inset, time, out = new THREE.Vector3()) => {
    const th = (u - 0.5) * 2.55;
    const cell = Math.pow(Math.abs(Math.sin(u * 7 * Math.PI)), 0.7);
    const cam = 0.45 * Math.sin(v * Math.PI);
    const rip = 0.05 * Math.sin(11 * u + 2 * time) * Math.sin(v * Math.PI)
              + 0.025 * Math.sin(7 * v - 2.6 * time + 3 * u);
    const rOut = 6 + cam + 0.16 * cell + rip;
    const rIn = lerp(rOut, 6 + 0.6 * cam + 0.05 * cell - 0.34 + rip, sm(0, 0.18, v));
    const r = lerp(rIn, rOut, w);
    return out.set(
      Math.sin(th) * r,
      4.4 + Math.cos(th) * r,
      (v - 0.5) * 4.1 * (0.88 + 0.12 * Math.sin(u * Math.PI)) - 0.4 * Math.pow(2 * u - 1, 2) - inset
    );
  };

  const _pt = new THREE.Vector3(), _rL = new THREE.Vector3(), _rR = new THREE.Vector3();

  function update(time, riserL, riserR) {
    for (let i = 0; i < verts.length; i++) {
      evalPt(verts[i].u, verts[i].v, verts[i].w, verts[i].inset, time, _pt);
      posArr[i * 3] = _pt.x; posArr[i * 3 + 1] = _pt.y; posArr[i * 3 + 2] = _pt.z;
    }
    posAttr.needsUpdate = true;
    wingGeo.computeVertexNormals();
    wingGeo.computeBoundingSphere();

    _rL.setFromMatrixPosition(riserL.matrixWorld); group.worldToLocal(_rL);
    _rR.setFromMatrixPosition(riserR.matrixWorld); group.worldToLocal(_rR);

    let p = 0;
    for (let g = 0; g < 8; g++) {
      const u = g / 7, target = g < 4 ? _rL : _rR;
      for (let ci = 0; ci < 3; ci++) {
        evalPt(u, CHORDS[ci], 0, 0, time, _pt);
        for (let s = 0; s < SEGS; s++) {
          const s0 = s / SEGS, s1 = (s + 1) / SEGS;
          const sag0 = -0.028 * (COSH - Math.cosh(1.7 * (2 * s0 - 1))) / (COSH - 1);
          const sag1 = -0.028 * (COSH - Math.cosh(1.7 * (2 * s1 - 1))) / (COSH - 1);
          lineArr[p++] = lerp(_pt.x, target.x, s0); lineArr[p++] = lerp(_pt.y, target.y, s0) + sag0; lineArr[p++] = lerp(_pt.z, target.z, s0);
          lineArr[p++] = lerp(_pt.x, target.x, s1); lineArr[p++] = lerp(_pt.y, target.y, s1) + sag1; lineArr[p++] = lerp(_pt.z, target.z, s1);
        }
      }
    }
    lineAttr.needsUpdate = true;
  }

  return { group, update };
}

  const ctx = cv.getContext('2d');
  const g = ctx.createRadialGradient(size / 2, size / 2, 0, size / 2, size / 2, size / 2);
  g.addColorStop(0.00, 'rgba(255,255,252,1.0)');
  g.addColorStop(0.05, 'rgba(255,253,238,1.0)');
  g.addColorStop(0.14, 'rgba(255,248,205,0.75)');
  g.addColorStop(0.32, 'rgba(255,240,170,0.30)');
  g.addColorStop(0.60, 'rgba(255,232,145,0.08)');
  g.addColorStop(1.00, 'rgba(255,225,125,0)');
  ctx.fillStyle = g;
  ctx.fillRect(0, 0, size, size);
  const tex = new THREE.CanvasTexture(cv);
  tex.colorSpace = THREE.SRGBColorSpace;
  const sp = new THREE.Sprite(new THREE.SpriteMaterial({
    map: tex, transparent: true, depthWrite: false,
    blending: THREE.AdditiveBlending, fog: false, toneMapped: false,
  }));
  sp.scale.set(1400, 1400, 1);
  return sp;
})();
scene.add(sunSprite);

/* ---------- 光照（主光主导、补光收弱，强化对比与色彩） ---------- */
const sunLight = new THREE.DirectionalLight(0xfff0d2, 2.1);
sunLight.position.copy(SUN_DIR).multiplyScalar(6000);
sunLight.castShadow = true;
sunLight.shadow.mapSize.set(2048, 2048);
sunLight.shadow.bias = -0.0004;
sunLight.shadow.normalBias = 0.02;
{
  const sc = sunLight.shadow.camera;
  sc.left = -18; sc.right = 18; sc.top = 18; sc.bottom = -18;
  sc.near = 1; sc.far = 220;
}
scene.add(sunLight);
scene.add(sunLight.target);

// 半球光调弱，避免整体发白
scene.add(new THREE.HemisphereLight(0x9ecbf2, 0x5a6b45, 0.40));

// 轮廓光（略冷白，用于勾边）
const rimLight = new THREE.DirectionalLight(0xffe6c4, 0.55);
rimLight.position.set(-SUN_DIR.x * 4000, 1800, -SUN_DIR.z * 4000);
scene.add(rimLight);

// 冷色补光极弱
const coolFill = new THREE.DirectionalLight(0xbcd9ff, 0.16);
coolFill.position.set(2500, 700, -2500);
scene.add(coolFill);

/* ---------- 地形 + 河流 ---------- */
const { terrain, water } = buildTerrainAndRiver();
scene.add(terrain);
scene.add(water);

/* ---------- 伞 / 领带 / osu! 挂坠 ---------- */
const parachute = createRamAirParachute();
const ribbon = createBlueRibbon();

const pendulum = new THREE.Group();
pendulum.position.set(0, 3.84, 0);
ribbon.group.position.set(0, -3.84, 0);
pendulum.add(ribbon.group);

const logoPivot = new THREE.Group();
logoPivot.position.set(0, ribbon.bottomY, 0.02);
const osuLogo = createOsuLogo();
osuLogo.group.position.set(0, -osuLogo.radius * 0.985, 0);
logoPivot.add(osuLogo.group);
ribbon.group.add(logoPivot);

parachute.group.add(pendulum);
parachute.group.position.set(0, START_Y, 0);
scene.add(parachute.group);

/* =====================================================================
   坠落状态
   ===================================================================== */
let falling = true;
let velocity = 0;
let fallTime = 0;

const MAX_SPEED = 75;
const ACCEL_TIME = 3.0;

const FIXED_STEP = 1 / 120;
let physicsAccumulator = 0;

const prevParachutePos = new THREE.Vector3(0, START_Y, 0);
const statusEl = document.getElementById('status');

function resetAll() {
  falling = true;
  velocity = 0;
  fallTime = 0;
  physicsAccumulator = 0;

  parachute.group.position.set(0, START_Y, 0);
  parachute.group.rotation.set(0, 0, 0);
  pendulum.rotation.set(0, 0, 0);
  logoPivot.rotation.set(0, 0, 0);

  prevParachutePos.set(0, START_Y, 0);

  camera.position.copy(parachute.group.position).add(CAM_OFFSET);
  controls.target.copy(parachute.group.position);
  controls.target.y += TARGET_LIFT;
  controls.update();

  statusEl.textContent = `高度：${START_Y.toFixed(0)} m`;
}

document.getElementById('resetBtn').addEventListener('click', resetAll);

/* =====================================================================
   渲染循环
   ===================================================================== */
const clock = new THREE.Clock(false);
let clockStarted = false;

function animate() {
  requestAnimationFrame(animate);

  if (!clockStarted) {
    clock.start();
    clockStarted = true;
    controls.update();
    renderer.render(scene, camera);
    return;
  }

  const dt = Math.min(0.1, clock.getDelta());
  const t = clock.getElapsedTime();

  physicsAccumulator += dt;
  physicsAccumulator = Math.min(physicsAccumulator, 0.1);
  while (physicsAccumulator >= FIXED_STEP) {
    if (falling) {
      fallTime += FIXED_STEP;
      const f = smoothstep(0, ACCEL_TIME, fallTime);
      velocity = MAX_SPEED * f;
      parachute.group.position.y -= velocity * FIXED_STEP;

      parachute.group.position.x = 22 * Math.sin(fallTime * 0.42);
      parachute.group.position.z = 15 * Math.cos(fallTime * 0.34);

      const k = velocity / MAX_SPEED;
      parachute.group.rotation.x = -0.03 - k * 0.06 + 0.02 * Math.sin(t * 1.05);
      parachute.group.rotation.z = 0.025 * Math.sin(t * 0.75);

      if (parachute.group.position.y <= STOP_Y) {
        parachute.group.position.y = STOP_Y;
        falling = false;
        velocity = 0;
      }
    }
    physicsAccumulator -= FIXED_STEP;
  }

  if (!falling) {
    parachute.group.rotation.z = 0.02 * Math.sin(t * 0.9);
    parachute.group.rotation.x = 0.03 * Math.sin(t * 0.7 + 0.5);
  }

  pendulum.rotation.z = 0.11 * Math.sin(t * 1.15);
  pendulum.rotation.x = 0.055 * Math.sin(t * 0.82 + 1.2);

  logoPivot.rotation.z = 0.05 * Math.sin(t * 1.38 + 0.7);
  logoPivot.rotation.x = 0.035 * Math.sin(t * 1.02 + 1.9);

  const delta = new THREE.Vector3().subVectors(parachute.group.position, prevParachutePos);
  camera.position.add(delta);
  controls.target.add(delta);
  prevParachutePos.copy(parachute.group.position);

  sunLight.position.copy(parachute.group.position).addScaledVector(SUN_DIR, 60);
  sunLight.target.position.copy(parachute.group.position);
  sunLight.target.updateMatrixWorld();

  skyDome.position.copy(camera.position);
  sunSprite.position.copy(camera.position).add(VISUAL_SUN_DIR.clone().multiplyScalar(10000));

  scene.updateMatrixWorld(true);
  parachute.update(t, ribbon.riserL, ribbon.riserR);

  if (falling || parachute.group.position.y > STOP_Y + 1) {
    statusEl.textContent = `高度：${parachute.group.position.y.toFixed(0)} m　速度：${(velocity * 0.36).toFixed(0)} km/h`;
  } else {
    statusEl.textContent = `已着陆　高度：${STOP_Y.toFixed(0)} m`;
  }

  controls.update();
  renderer.render(scene, camera);
}
animate();

window.addEventListener('resize', () => {
  camera.aspect = window.innerWidth / window.innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(window.innerWidth, window.innerHeight);
});
</script>
